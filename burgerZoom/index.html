<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://burger-zoom.vercel.app/</title>
</head>
<body>
 <iframe
    id="frame"
    src = "index2.html";
    width="100%"
    height="500"
    scrolling="no"
    style="border: 1px solid black;  overflow:auto;">
</iframe>
<img src ="burgetScan.png" width="400" height="400" alt="no image" />
  

    <script>
       const iframe = document.getElementById("frame");
      const isMobile = window.matchMedia("(max-width: 768px)").matches;

      if (isMobile) {

        iframe.width = "100%"

           console.log("Mobile layout");
              } else {
                 iframe.width = "350"
                
                   
                    }

        function scroll(){
     
      
    iframe.src="index2.html"
      iframe.onload = () => {
    const win = iframe.contentWindow;

    // Get scroll offsets
    console.log("X:", win.scrollX);
    console.log("Y:", win.scrollY);

    // Set scroll offsets
   win.scrollTo(300,500); // x = 100, y = 0

  // iframe.srolling="no"

    // Or:
  //  win.scrollBy(50, 0);  // move 50px horizontally
};
      
        }
        
scroll()

   // setTimeout(scroll, 2000);


    </script>
    
</body>
</html>
